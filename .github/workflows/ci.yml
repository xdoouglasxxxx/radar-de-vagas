name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./apps/worker[dev]"
      - run: ruff check apps/worker
      # Testes de banco só rodam se o secret TEST_DATABASE_URL (Neon DEV) existir.
      # Secrets não são expostos a PRs de forks.
      - run: pytest apps/worker
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
