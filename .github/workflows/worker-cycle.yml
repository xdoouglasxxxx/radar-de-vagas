name: worker-cycle

# Um ciclo do worker a cada 15 min (o GitHub pode atrasar execuções agendadas).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: worker-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ative definindo a variável de repositório WORKER_ENABLED=true
    if: ${{ vars.WORKER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - run: pip install ./apps/worker
      - name: Ciclo
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKER_MAX_SECONDS: "600"
        run: python -m app.main --once
